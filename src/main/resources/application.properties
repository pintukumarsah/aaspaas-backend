spring.application.name=aaspaas-backend
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aaspaas_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# #validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=9090

app.otp.development-mode=true
app.otp.expiry-minutes=60

# CORS CONFIGURATION

app.cors.allowed-origins=http://localhost:4200,http://localhost:8100,http://127.0.0.1:4200
spring.application.name=aaspaas-backend
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aaspaas_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# #validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=9090

app.otp.development-mode=true
app.otp.expiry-minutes=60

# CORS CONFIGURATION

app.cors.allowed-origins=http://localhost:4200,http://localhost:8100,http://127.0.0.1:4200


# API RATE LIMITING

app.rate-limit.enabled=true

# Must match the actual login controller mapping.
app.rate-limit.login-path=/api/auth/login

# Login: 10 requests per IP per 60-second fixed window.
app.rate-limit.login-limit=10
app.rate-limit.login-window-seconds=60

# Public product/category GET APIs.
app.rate-limit.public-limit=120
app.rate-limit.public-window-seconds=60

# Other /api/** endpoints.
app.rate-limit.default-limit=180
app.rate-limit.default-window-seconds=60